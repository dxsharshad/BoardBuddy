# Builds BoardBuddy in the cloud, so nothing has to be installed on your phone.
#   1) "web"    -> builds the PWA and publishes it with GitHub Pages
#   2) "apk"    -> builds an installable debug APK and attaches it to a GitHub Release
# Runs on every push to main, or manually: Actions tab -> "Build BoardBuddy" -> Run workflow.
name: Build BoardBuddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release that holds the APK
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check (reported, does not block the build)
        run: npm run typecheck
        continue-on-error: true
      - name: Unit tests (usage tracker)
        run: npm run test:usage
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app (relative paths for the Android wrapper)
        run: npm run build
      - name: Create Android project and copy the web build into it
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BoardBuddy-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BoardBuddy-debug-apk
          path: BoardBuddy-debug.apk
      - name: Publish APK as a Release (easy to download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BoardBuddy APK build ${{ github.run_number }}
          body: Debug APK. Download BoardBuddy-debug.apk on your Android phone and open it to install.
          files: BoardBuddy-debug.apk
